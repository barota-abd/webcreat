<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Orbite Studio</title>
    <meta name="description" content="Agence web à Repentigny : création de sites internet, applications mobiles, référencement SEO et publicité en ligne. Devis gratuit sous 48 h." />
    <meta property="og:title" content="Orbite Studio" />
    <meta property="og:description" content="Agence de création de sites web et de développement d'applications. Sites, apps, SEO, publicité en ligne." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_CA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Polices, couleur de barre système et favicon sont posés par
         src/main.jsx, car ils dépendent du design retenu. -->

    <!-- Le thème est posé avant le premier affichage : si on attendait React,
         la page clignoterait en clair chez les visiteurs dont le système est
         en clair. Le site est sombre par défaut ; un choix explicite retenu
         dans le navigateur l'emporte. -->
    <script>
      (function () {
        var t = "dark";
        try {
          var v = localStorage.getItem("orbite-theme");
          if (v === "light" || v === "dark") t = v;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
